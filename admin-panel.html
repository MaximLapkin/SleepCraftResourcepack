<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель СКРП</title>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #1a1a1a; color: #e0e0e0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { color: #58a6ff; margin-bottom: 20px; }
        .login-box { background: #2a2a2a; padding: 30px; border-radius: 12px; max-width: 400px; margin: 100px auto; }
        .login-box input { width: 100%; padding: 10px; margin: 10px 0; background: #1a1a1a; border: 1px solid #444; color: #e0e0e0; border-radius: 6px; }
        .login-box button { width: 100%; padding: 10px; background: #58a6ff; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .admin-panel { display: none; }
        .admin-panel.active { display: block; }
        .toolbar { margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
        .btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.95rem; }
        .btn-add { background: #28a745; color: white; }
        .btn-download { background: #ffc107; color: #000; }
        .btn-logout { background: #ff4d4d; color: white; }
        .btn-add-cat { background: #6f42c1; color: white; }
        .btn-add-link { background: #17a2b8; color: white; }
        .section-title { color: #58a6ff; margin: 30px 0 15px 0; font-size: 1.5rem; border-bottom: 2px solid #444; padding-bottom: 10px; }
        .category-block { background: #2a2a2a; padding: 20px; border-radius: 12px; margin-bottom: 20px; cursor: grab; transition: background 0.2s; }
        .category-block:hover { background: #2f2f2f; }
        .category-block.dragging { opacity: 0.5; }
        .category-header { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; border-bottom: 1px solid #444; padding-bottom: 10px; }
        .category-header h2 { color: #58a6ff; margin: 0; flex: 1; }
        .drag-handle-cat { font-size: 1.5rem; color: #666; cursor: grab; user-select: none; padding: 5px; }
        .drag-handle-cat:hover { color: #58a6ff; }
        .model-item { background: #1a1a1a; padding: 12px 15px; margin: 8px 0; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; cursor: grab; transition: background 0.2s; }
        .model-item:hover { background: #252525; }
        .model-item.dragging { opacity: 0.5; background: #333; }
        .model-item img { width: 40px; height: 40px; object-fit: contain; margin-right: 15px; }
        .model-info { display: flex; align-items: center; flex: 1; }
        .model-details { flex: 1; }
        .model-details strong { color: #e0e0e0; }
        .model-details small { color: #888; display: block; margin-top: 3px; }
        .drag-handle { font-size: 1.5rem; color: #666; cursor: grab; margin-right: 15px; user-select: none; padding: 5px; }
        .drag-handle:hover { color: #58a6ff; }
        .model-actions { display: flex; gap: 8px; }
        .btn-edit { background: #58a6ff; color: white; padding: 6px 12px; font-size: 0.85rem; }
        .btn-delete { background: #ff4d4d; color: white; padding: 6px 12px; font-size: 0.85rem; }
        .link-item { background: #1a1a1a; padding: 12px 15px; margin: 8px 0; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; cursor: grab; }
        .link-item:hover { background: #252525; }
        .link-item.dragging { opacity: 0.5; }
        .link-info { display: flex; align-items: center; flex: 1; gap: 10px; }
        .link-icon { font-size: 1.5rem; }
        .link-details strong { color: #e0e0e0; }
        .link-details small { color: #888; display: block; margin-top: 3px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center; }
        .modal.active { display: flex; }
        .modal-content { background: #2a2a2a; padding: 30px; border-radius: 12px; width: 500px; max-width: 90%; max-height: 90vh; overflow-y: auto; }
        .modal-content input, .modal-content select, .modal-content textarea { width: 100%; padding: 10px; margin: 8px 0; background: #1a1a1a; border: 1px solid #444; color: #e0e0e0; border-radius: 6px; }
        .modal-content label { display: block; margin-top: 12px; color: #58a6ff; font-size: 0.9rem; }
        .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
        .btn-save { background: #28a745; color: white; flex: 1; padding: 12px; }
        .btn-cancel { background: #ff4d4d; color: white; padding: 12px; }
        .error { color: #ff4d4d; margin-top: 10px; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-box" id="loginBox">
            <h2> Вход в админ-панель</h2>
            <input type="text" id="username" placeholder="Логин">
            <input type="password" id="password" placeholder="Пароль">
            <button onclick="login()">Войти</button>
            <div class="error" id="errorMsg">Неверный логин или пароль!</div>
        </div>

        <div class="admin-panel" id="adminPanel">
            <h1>🛠️ Админ-панель СКРП</h1>
            <div class="toolbar">
                <button class="btn btn-add" onclick="openAddModal()">➕ Добавить модель</button>
                <button class="btn btn-add-cat" onclick="openAddCategoryModal()">📁 Добавить категорию</button>
                <button class="btn btn-add-link" onclick="openAddLinkModal()"> Добавить ссылку</button>
                <button class="btn btn-download" onclick="downloadModels()"> Скачать models.json</button>
                <button class="btn btn-logout" onclick="logout()"> Выйти</button>
            </div>

            <h2 class="section-title">📂 Категории и модели</h2>
            <div id="categoriesList"></div>

            <h2 class="section-title"> Ссылки (правая панель)</h2>
            <div id="linksList"></div>
        </div>
    </div>

    <!-- Модалка модели -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <h3 id="modalTitle">Добавить модель</h3>
            <label>Категория:</label>
            <select id="category"></select>
            <label>Иконка (путь):</label>
            <input type="text" id="icon" placeholder="images/example.png">
            <label>Переименование:</label>
            <input type="text" id="name" placeholder="Название">
            <label>Предмет:</label>
            <input type="text" id="item" placeholder="Предмет">
            <label>Особенность:</label>
            <textarea id="feature" rows="3" placeholder="Описание"></textarea>
            <div class="modal-actions">
                <button class="btn btn-save" onclick="saveModel()">💾 Сохранить</button>
                <button class="btn btn-cancel" onclick="closeModal()">Отмена</button>
            </div>
        </div>
    </div>

    <!-- Модалка категории -->
    <div class="modal" id="categoryModal">
        <div class="modal-content">
            <h3>📁 Добавить новую категорию</h3>
            <label>Название категории:</label>
            <input type="text" id="newCategoryName" placeholder="Например: Броня">
            <div class="modal-actions">
                <button class="btn btn-save" onclick="addCategory()">💾 Добавить</button>
                <button class="btn btn-cancel" onclick="closeCategoryModal()">Отмена</button>
            </div>
        </div>
    </div>

    <!-- Модалка ссылки -->
    <div class="modal" id="linkModal">
        <div class="modal-content">
            <h3 id="linkModalTitle">Добавить ссылку</h3>
            <label>Иконка (эмодзи):</label>
            <input type="text" id="linkIcon" placeholder="⬆️">
            <label>Название:</label>
            <input type="text" id="linkTitle" placeholder="Наверх">
            <label>URL:</label>
            <input type="text" id="linkUrl" placeholder="#аксессуары или https://...">
            <div class="modal-actions">
                <button class="btn btn-save" onclick="saveLink()">💾 Сохранить</button>
                <button class="btn btn-cancel" onclick="closeLinkModal()">Отмена</button>
            </div>
        </div>
    </div>

    <script src="users.js"></script>
    <script>
        let models = [];
        let categories = [];
        let links = [];
        let editingIndex = -1;
        let editingLinkIndex = -1;

        async function login() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');

            const msgUint8 = new TextEncoder().encode(password + "SCRP_Salt_2024_Secret_Key_!@#");
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashedPass = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

            if (ADMIN_USERS[username] && ADMIN_USERS[username] === hashedPass) {
                localStorage.setItem('adminLoggedIn', 'true');
                localStorage.setItem('adminUser', username);
                showAdminPanel();
            } else {
                errorMsg.style.display = 'block';
                setTimeout(() => errorMsg.style.display = 'none', 3000);
            }
        }

        function logout() {
            localStorage.removeItem('adminLoggedIn');
            localStorage.removeItem('adminUser');
            window.location.href = 'index.html?logout=true';
        }

        async function showAdminPanel() {
            document.getElementById('loginBox').style.display = 'none';
            document.getElementById('adminPanel').classList.add('active');
            await loadModels();
        }

        async function loadModels() {
            try {
                const response = await fetch('models.json');
                const data = await response.json();
                models = data.models || [];
                categories = data.categories || [];
                links = data.links || [];
                renderModels();
                renderLinks();
            } catch (error) {
                console.error('Ошибка загрузки:', error);
                models = [];
                categories = [];
                links = [];
                renderModels();
                renderLinks();
            }
        }

        function renderModels() {
            const list = document.getElementById('categoriesList');
            list.innerHTML = '';

            if (categories.length === 0) {
                list.innerHTML = '<p style="color: #888;">Нет категорий. Добавьте первую!</p>';
                return;
            }

            categories.forEach(category => {
                const modelsInCat = models.filter(m => m.category === category);
                
                const block = document.createElement('div');
                block.className = 'category-block';
                block.dataset.category = category;
                
                const modelsContainer = document.createElement('div');
                modelsContainer.className = 'models-container';

                let modelsHTML = modelsInCat.map((model) => {
                    const realIndex = models.indexOf(model);
                    return `
                        <div class="model-item" data-index="${realIndex}">
                            <span class="drag-handle" title="Перетащи">⋮</span>
                            <div class="model-info">
                                <img src="${model.icon}" alt="" onerror="this.style.display='none'">
                                <div class="model-details">
                                    <strong>${model.name}</strong>
                                    <small>${model.item}${model.feature ? ' • ' + model.feature : ''}</small>
                                </div>
                            </div>
                            <div class="model-actions">
                                <button class="btn btn-edit" onclick="editModel(${realIndex})">✏️</button>
                                <button class="btn btn-delete" onclick="deleteModel(${realIndex})">️</button>
                            </div>
                        </div>
                    `;
                }).join('');

                if (modelsInCat.length === 0) {
                    modelsHTML = '<p style="color: #666; font-style: italic;">Нет моделей в этой категории</p>';
                }

                modelsContainer.innerHTML = modelsHTML;
                block.innerHTML = `
                    <div class="category-header">
                        <span class="drag-handle-cat" title="Перетащи категорию">⋮⋮</span>
                        <h2>${category} (${modelsInCat.length})</h2>
                    </div>
                `;
                block.appendChild(modelsContainer);
                list.appendChild(block);

                if (modelsInCat.length > 0) {
                    new Sortable(modelsContainer, {
                        handle: '.drag-handle',
                        animation: 150,
                        ghostClass: 'dragging',
                        onEnd: function(evt) {
                            const oldIndex = parseInt(evt.item.dataset.index);
                            const newIndex = evt.newIndex;
                            const movedModel = models.splice(oldIndex, 1)[0];
                            const categoryModels = models.filter(m => m.category === category);
                            const categoryStartIndex = models.indexOf(categoryModels[0]);
                            models.splice(categoryStartIndex + newIndex, 0, movedModel);
                            renderModels();
                        }
                    });
                }
            });

            new Sortable(list, {
                handle: '.drag-handle-cat',
                animation: 150,
                ghostClass: 'dragging',
                onEnd: function(evt) {
                    const movedCategory = categories.splice(evt.oldIndex, 1)[0];
                    categories.splice(evt.newIndex, 0, movedCategory);
                    renderModels();
                }
            });
        }

        function renderLinks() {
            const list = document.getElementById('linksList');
            list.innerHTML = '';

            if (links.length === 0) {
                list.innerHTML = '<p style="color: #888;">Нет ссылок. Добавьте первую!</p>';
                return;
            }

            const linksContainer = document.createElement('div');
            linksContainer.className = 'links-container';

            linksContainer.innerHTML = links.map((link, idx) => `
                <div class="link-item" data-index="${idx}">
                    <span class="drag-handle" title="Перетащи">⋮⋮</span>
                    <div class="link-info">
                        <span class="link-icon">${link.icon || '🔗'}</span>
                        <div class="link-details">
                            <strong>${link.title}</strong>
                            <small>${link.url}</small>
                        </div>
                    </div>
                    <div class="model-actions">
                        <button class="btn btn-edit" onclick="editLink(${idx})">✏️</button>
                        <button class="btn btn-delete" onclick="deleteLink(${idx})">🗑️</button>
                    </div>
                </div>
            `).join('');

            list.appendChild(linksContainer);

            new Sortable(linksContainer, {
                handle: '.drag-handle',
                animation: 150,
                ghostClass: 'dragging',
                onEnd: function(evt) {
                    const movedLink = links.splice(evt.oldIndex, 1)[0];
                    links.splice(evt.newIndex, 0, movedLink);
                    renderLinks();
                }
            });
        }

        function populateCategorySelect() {
            const select = document.getElementById('category');
            select.innerHTML = categories.map(cat => `<option value="${cat}">${cat}</option>`).join('');
        }

        function openAddModal() {
            editingIndex = -1;
            document.getElementById('modalTitle').textContent = 'Добавить модель';
            populateCategorySelect();
            document.getElementById('category').value = categories[0] || '';
            document.getElementById('icon').value = '';
            document.getElementById('name').value = '';
            document.getElementById('item').value = '';
            document.getElementById('feature').value = '';
            document.getElementById('modal').classList.add('active');
        }

        function editModel(index) {
            editingIndex = index;
            const model = models[index];
            document.getElementById('modalTitle').textContent = 'Редактировать модель';
            populateCategorySelect();
            document.getElementById('category').value = model.category;
            document.getElementById('icon').value = model.icon;
            document.getElementById('name').value = model.name;
            document.getElementById('item').value = model.item;
            document.getElementById('feature').value = model.feature || '';
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        function saveModel() {
            const model = {
                category: document.getElementById('category').value,
                icon: document.getElementById('icon').value,
                name: document.getElementById('name').value,
                item: document.getElementById('item').value,
                feature: document.getElementById('feature').value
            };

            if (!model.name || !model.category) {
                alert('Заполните название и выберите категорию!');
                return;
            }

            if (editingIndex === -1) {
                models.push(model);
            } else {
                models[editingIndex] = model;
            }

            closeModal();
            renderModels();
        }

        function deleteModel(index) {
            if (confirm('Удалить модель "' + models[index].name + '"?')) {
                models.splice(index, 1);
                renderModels();
            }
        }

        function openAddCategoryModal() {
            document.getElementById('newCategoryName').value = '';
            document.getElementById('categoryModal').classList.add('active');
        }

        function closeCategoryModal() {
            document.getElementById('categoryModal').classList.remove('active');
        }

        function addCategory() {
            const name = document.getElementById('newCategoryName').value.trim();
            if (!name) {
                alert('Введите название категории!');
                return;
            }
            if (categories.includes(name)) {
                alert('Такая категория уже существует!');
                return;
            }
            categories.push(name);
            closeCategoryModal();
            renderModels();
        }

        // === ССЫЛКИ ===
        function openAddLinkModal() {
            editingLinkIndex = -1;
            document.getElementById('linkModalTitle').textContent = 'Добавить ссылку';
            document.getElementById('linkIcon').value = '🔗';
            document.getElementById('linkTitle').value = '';
            document.getElementById('linkUrl').value = '';
            document.getElementById('linkModal').classList.add('active');
        }

        function editLink(index) {
            editingLinkIndex = index;
            const link = links[index];
            document.getElementById('linkModalTitle').textContent = 'Редактировать ссылку';
            document.getElementById('linkIcon').value = link.icon || '🔗';
            document.getElementById('linkTitle').value = link.title;
            document.getElementById('linkUrl').value = link.url;
            document.getElementById('linkModal').classList.add('active');
        }

        function closeLinkModal() {
            document.getElementById('linkModal').classList.remove('active');
        }

        function saveLink() {
            const link = {
                icon: document.getElementById('linkIcon').value || '🔗',
                title: document.getElementById('linkTitle').value,
                url: document.getElementById('linkUrl').value
            };

            if (!link.title || !link.url) {
                alert('Заполните название и URL!');
                return;
            }

            if (editingLinkIndex === -1) {
                links.push(link);
            } else {
                links[editingLinkIndex] = link;
            }

            closeLinkModal();
            renderLinks();
        }

        function deleteLink(index) {
            if (confirm('Удалить ссылку "' + links[index].title + '"?')) {
                links.splice(index, 1);
                renderLinks();
            }
        }

        function downloadModels() {
            const data = {
                categories: categories,
                models: models,
                links: links
            };
            const jsonStr = JSON.stringify(data, null, 2);
            const blob = new Blob([jsonStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'models.json';
            a.click();
            URL.revokeObjectURL(url);
        }

        if (localStorage.getItem('adminLoggedIn') === 'true') {
            showAdminPanel();
        }
    </script>
</body>
</html>
