<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель СКРП</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Arial, sans-serif; background: #1a1a1a; color: #e0e0e0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { color: #58a6ff; margin-bottom: 20px; }
        .login-box { background: #2a2a2a; padding: 30px; border-radius: 12px; max-width: 400px; margin: 100px auto; }
        .login-box input { width: 100%; padding: 10px; margin: 10px 0; background: #1a1a1a; border: 1px solid #444; color: #e0e0e0; border-radius: 6px; }
        .login-box button { width: 100%; padding: 10px; background: #58a6ff; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .admin-panel { display: none; }
        .admin-panel.active { display: block; }
        .toolbar { margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap; }
        .btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.95rem; }
        .btn-add { background: #28a745; color: white; }
        .btn-download { background: #ffc107; color: #000; }
        .btn-logout { background: #ff4d4d; color: white; }
        .btn-add-cat { background: #6f42c1; color: white; }
        .category-block { background: #2a2a2a; padding: 20px; border-radius: 12px; margin-bottom: 20px; }
        .category-block h2 { color: #58a6ff; margin-bottom: 15px; border-bottom: 1px solid #444; padding-bottom: 10px; }
        .model-item { background: #1a1a1a; padding: 12px 15px; margin: 8px 0; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }
        .model-item img { width: 40px; height: 40px; object-fit: contain; margin-right: 15px; }
        .model-info { display: flex; align-items: center; flex: 1; }
        .model-details { flex: 1; }
        .model-details strong { color: #e0e0e0; }
        .model-details small { color: #888; display: block; margin-top: 3px; }
        .model-actions { display: flex; gap: 8px; }
        .btn-edit { background: #58a6ff; color: white; padding: 6px 12px; font-size: 0.85rem; }
        .btn-delete { background: #ff4d4d; color: white; padding: 6px 12px; font-size: 0.85rem; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center; }
        .modal.active { display: flex; }
        .modal-content { background: #2a2a2a; padding: 30px; border-radius: 12px; width: 500px; max-width: 90%; max-height: 90vh; overflow-y: auto; }
        .modal-content input, .modal-content select, .modal-content textarea { width: 100%; padding: 10px; margin: 8px 0; background: #1a1a1a; border: 1px solid #444; color: #e0e0e0; border-radius: 6px; }
        .modal-content label { display: block; margin-top: 12px; color: #58a6ff; font-size: 0.9rem; }
        .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
        .btn-save { background: #28a745; color: white; flex: 1; padding: 12px; }
        .btn-cancel { background: #ff4d4d; color: white; padding: 12px; }
        .error { color: #ff4d4d; margin-top: 10px; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="login-box" id="loginBox">
            <h2> Вход в админ-панель</h2>
            <input type="text" id="username" placeholder="Логин">
            <input type="password" id="password" placeholder="Пароль">
            <button onclick="login()">Войти</button>
            <div class="error" id="errorMsg">Неверный логин или пароль!</div>
        </div>

        <div class="admin-panel" id="adminPanel">
            <h1>🛠️ Админ-панель СКРП</h1>
            <div class="toolbar">
                <button class="btn btn-add" onclick="openAddModal()">➕ Добавить модель</button>
                <button class="btn btn-add-cat" onclick="openAddCategoryModal()">📁 Добавить категорию</button>
                <button class="btn btn-download" onclick="downloadModels()">📥 Скачать models.json</button>
                <button class="btn btn-logout" onclick="logout()">🚪 Выйти</button>
            </div>
            <div id="modelList"></div>
        </div>
    </div>

    <!-- Модалка модели -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <h3 id="modalTitle">Добавить модель</h3>
            <label>Категория:</label>
            <select id="category"></select>
            <label>Иконка (путь):</label>
            <input type="text" id="icon" placeholder="images/example.png">
            <label>Переименование:</label>
            <input type="text" id="name" placeholder="Название">
            <label>Предмет:</label>
            <input type="text" id="item" placeholder="Предмет">
            <label>Особенность:</label>
            <textarea id="feature" rows="3" placeholder="Описание"></textarea>
            <div class="modal-actions">
                <button class="btn btn-save" onclick="saveModel()">💾 Сохранить</button>
                <button class="btn btn-cancel" onclick="closeModal()">Отмена</button>
            </div>
        </div>
    </div>

    <!-- Модалка категории -->
    <div class="modal" id="categoryModal">
        <div class="modal-content">
            <h3>📁 Добавить новую категорию</h3>
            <label>Название категории:</label>
            <input type="text" id="newCategoryName" placeholder="Например: Броня">
            <div class="modal-actions">
                <button class="btn btn-save" onclick="addCategory()">💾 Добавить</button>
                <button class="btn btn-cancel" onclick="closeCategoryModal()">Отмена</button>
            </div>
        </div>
    </div>

    <script src="users.js"></script>
    <script>
        let models = [];
        let categories = [];
        let editingIndex = -1;

        async function login() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');

            const msgUint8 = new TextEncoder().encode(password + "SCRP_Salt_2024_Secret_Key_!@#");
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashedPass = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');

            if (ADMIN_USERS[username] && ADMIN_USERS[username] === hashedPass) {
                localStorage.setItem('adminLoggedIn', 'true');
                localStorage.setItem('adminUser', username);
                showAdminPanel();
            } else {
                errorMsg.style.display = 'block';
                setTimeout(() => errorMsg.style.display = 'none', 3000);
            }
        }

        function logout() {
            localStorage.removeItem('adminLoggedIn');
            localStorage.removeItem('adminUser');
            location.reload();
        }

        async function showAdminPanel() {
            document.getElementById('loginBox').style.display = 'none';
            document.getElementById('adminPanel').classList.add('active');
            await loadModels();
        }

        async function loadModels() {
            try {
                const response = await fetch('models.json');
                const data = await response.json();
                models = data.models || [];
                categories = data.categories || [];
                renderModels();
            } catch (error) {
                console.error('Ошибка загрузки:', error);
                models = [];
                categories = [];
                renderModels();
            }
        }

        function renderModels() {
            const list = document.getElementById('modelList');
            list.innerHTML = '';

            if (categories.length === 0) {
                list.innerHTML = '<p style="color: #888;">Нет категорий. Добавьте первую!</p>';
                return;
            }

            categories.forEach(category => {
                const modelsInCat = models.filter(m => m.category === category);
                
                const block = document.createElement('div');
                block.className = 'category-block';
                
                let modelsHTML = modelsInCat.map((model, idx) => {
                    const realIndex = models.indexOf(model);
                    return `
                        <div class="model-item">
                            <div class="model-info">
                                <img src="${model.icon}" alt="" onerror="this.style.display='none'">
                                <div class="model-details">
                                    <strong>${model.name}</strong>
                                    <small>${model.item}${model.feature ? ' • ' + model.feature : ''}</small>
                                </div>
                            </div>
                            <div class="model-actions">
                                <button class="btn btn-edit" onclick="editModel(${realIndex})">✏️</button>
                                <button class="btn btn-delete" onclick="deleteModel(${realIndex})">🗑️</button>
                            </div>
                        </div>
                    `;
                }).join('');

                if (modelsInCat.length === 0) {
                    modelsHTML = '<p style="color: #666; font-style: italic;">Нет моделей в этой категории</p>';
                }

                block.innerHTML = `
                    <h2>${category} (${modelsInCat.length})</h2>
                    ${modelsHTML}
                `;
                list.appendChild(block);
            });
        }

        function populateCategorySelect() {
            const select = document.getElementById('category');
            select.innerHTML = categories.map(cat => `<option value="${cat}">${cat}</option>`).join('');
        }

        function openAddModal() {
            editingIndex = -1;
            document.getElementById('modalTitle').textContent = 'Добавить модель';
            populateCategorySelect();
            document.getElementById('category').value = categories[0] || '';
            document.getElementById('icon').value = '';
            document.getElementById('name').value = '';
            document.getElementById('item').value = '';
            document.getElementById('feature').value = '';
            document.getElementById('modal').classList.add('active');
        }

        function editModel(index) {
            editingIndex = index;
            const model = models[index];
            document.getElementById('modalTitle').textContent = 'Редактировать модель';
            populateCategorySelect();
            document.getElementById('category').value = model.category;
            document.getElementById('icon').value = model.icon;
            document.getElementById('name').value = model.name;
            document.getElementById('item').value = model.item;
            document.getElementById('feature').value = model.feature || '';
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        function saveModel() {
            const model = {
                category: document.getElementById('category').value,
                icon: document.getElementById('icon').value,
                name: document.getElementById('name').value,
                item: document.getElementById('item').value,
                feature: document.getElementById('feature').value
            };

            if (!model.name || !model.category) {
                alert('Заполните название и выберите категорию!');
                return;
            }

            if (editingIndex === -1) {
                models.push(model);
            } else {
                models[editingIndex] = model;
            }

            closeModal();
            renderModels();
        }

        function deleteModel(index) {
            if (confirm('Удалить модель "' + models[index].name + '"?')) {
                models.splice(index, 1);
                renderModels();
            }
        }

        // === КАТЕГОРИИ ===
        function openAddCategoryModal() {
            document.getElementById('newCategoryName').value = '';
            document.getElementById('categoryModal').classList.add('active');
        }

        function closeCategoryModal() {
            document.getElementById('categoryModal').classList.remove('active');
        }

        function addCategory() {
            const name = document.getElementById('newCategoryName').value.trim();
            if (!name) {
                alert('Введите название категории!');
                return;
            }
            if (categories.includes(name)) {
                alert('Такая категория уже существует!');
                return;
            }
            categories.push(name);
            closeCategoryModal();
            renderModels();
        }

        function downloadModels() {
            const data = {
                categories: categories,
                models: models
            };
            const jsonStr = JSON.stringify(data, null, 2);
            const blob = new Blob([jsonStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'models.json';
            a.click();
            URL.revokeObjectURL(url);
        }

        if (localStorage.getItem('adminLoggedIn') === 'true') {
            showAdminPanel();
        }
    </script>
</body>
</html>
