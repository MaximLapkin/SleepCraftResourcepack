<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SleepCraft Resource Pack</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <canvas id="bgCanvas"></canvas>

    <!-- Кнопки входа/выхода -->
    <button id="loginBtn" class="admin-entry-btn" onclick="location.href='login.html'">🔐 Панель</button>
    <button id="logoutBtn" class="admin-entry-btn" style="display: none; background: #ff4d4d; border-color: #ff4d4d; color: white;"> Выйти</button>

    <!-- Сайдбары -->
    <div class="sidebar left-sidebar">
        <div class="tab"> Содержание</div>
        <div class="content" id="sidebarContent"></div>
    </div>
    <div class="sidebar right-sidebar">
        <div class="tab"> Навигация</div>
        <div class="content" id="navContent"></div>
    </div>

    <!-- Основной контент -->
    <main>
        <h1>SleepCraft Resource Pack</h1>
        <p class="subtitle">Коллекция уникальных моделей для Minecraft</p>
        
        <!-- Сюда JavaScript автоматически вставит все категории -->
        <div id="modelsContainer"></div>
    </main>

    <!-- Плеер -->
    <div class="player-container">
        <button class="music-btn" id="musicToggleBtn">🎵</button>
        <div class="mini-player" id="miniPlayer">
            <div class="track-info" id="trackName">Загрузка...</div>
            <div class="controls">
                <button class="ctrl-btn" id="prevBtn">⏮</button>
                <button class="ctrl-btn play-pause" id="playPauseBtn">▶</button>
                <button class="ctrl-btn" id="nextBtn">⏭</button>
            </div>
            <div class="volume-control">
                <span>🔊</span>
                <input type="range" id="volumeSlider" min="0" max="1" step="0.1" value="0.5">
            </div>
            <button class="ctrl-btn" id="playlistToggleBtn" style="margin-top: 10px; width: 100%;">📋 Плейлист</button>
            <ul class="playlist-container" id="playlistContainer"></ul>
        </div>
    </div>
    <audio id="mainAudio"></audio>

    <!-- Секретка -->
    <div id="secretOverlay" class="hidden">
        <div id="creepyText" class="creepy-text"></div>
    </div>
    <audio id="secretMusic" src="music/secret.mp3" loop></audio>

    <!-- Модальное окно админки -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <h3>➕ Добавить в: <span id="modalCategoryTitle">Категория</span></h3>
            <label>Изображение (путь):</label>
            <input type="text" id="formImage" placeholder="images/example.png">
            <label>Переименование:</label>
            <input type="text" id="formName" placeholder="Название">
            <label>Предмет:</label>
            <input type="text" id="formItem" placeholder="Предмет">
            <label>Особенность:</label>
            <textarea id="formFeature" rows="3" placeholder="Описание"></textarea>
            <div class="modal-actions">
                <button class="btn-generate" onclick="generateCode()">Сгенерировать код</button>
                <button class="btn-close" onclick="closeModal()">Закрыть</button>
            </div>
            <div class="result-box" id="resultBox"></div>
            <button class="btn-copy" id="btnCopy" onclick="copyCode()">📋 Скопировать</button>
        </div>
    </div>

    <script src="users.js"></script>
    <script>
        // === ЗАГРУЗКА МОДЕЛЕЙ ИЗ models.json ===
        let allModels = [];
        const categories = ["Аксессуары", "Элитры", "Булавы", "Мечи", "Кирки", "Лопаты", "Копья", "Щиты", "Тотемы", "Огнестрельное оружие", "Стрелы", "Шалкера", "Декор", "Стойки для брони", "Еда", "Зелья", "Книги", "Игры", "Прочее"];

        async function loadModels() {
            try {
                const response = await fetch('models.json');
                const data = await response.json();
                allModels = data.models || [];
                renderModels();
                renderSidebars();
            } catch (error) {
                console.error('Ошибка загрузки models.json:', error);
                document.getElementById('modelsContainer').innerHTML = '<p style="color: #ff4d4d;">Ошибка загрузки моделей. Проверьте файл models.json.</p>';
            }
        }

        function renderModels() {
            const container = document.getElementById('modelsContainer');
            container.innerHTML = '';

            categories.forEach(category => {
                const modelsInCategory = allModels.filter(m => m.category === category);
                if (modelsInCategory.length === 0) return;

                const section = document.createElement('section');
                section.id = category.toLowerCase().replace(/\s+/g, '-');
                section.innerHTML = `
                    <h2>${category}</h2>
                    <div class="table-wrapper">
                        <table>
                            <thead>
                                <tr>
                                    <th width="80">Иконка</th>
                                    <th>Переименование</th>
                                    <th>Предмет</th>
                                    <th>Особенность</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${modelsInCategory.map(model => `
                                    <tr>
                                        <td><img src="${model.icon}" alt="" class="item-icon"></td>
                                        <td>${model.name}</td>
                                        <td>${model.item}</td>
                                        <td>${model.feature ? model.feature.replace(/\n/g, '<br>') : ''}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
                container.appendChild(section);
            });

            // Добавляем админ-кнопки если вошёл
            if (localStorage.getItem('adminLoggedIn') === 'true') {
                document.querySelectorAll('section').forEach(section => {
                    const titleEl = section.querySelector('h2');
                    const categoryName = titleEl ? titleEl.textContent.trim() : 'Категория';
                    const btn = document.createElement('button');
                    btn.className = 'admin-add-btn';
                    btn.textContent = '➕ Добавить в ' + categoryName;
                    btn.onclick = () => openAddModal(categoryName);
                    btn.style.cssText = 'background: #28a745; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; margin-bottom: 10px; display: inline-block;';
                    section.insertBefore(btn, section.firstChild);
                });
            }
        }

        function renderSidebars() {
            const sidebarContent = document.getElementById('sidebarContent');
            const navContent = document.getElementById('navContent');
            
            sidebarContent.innerHTML = categories.map(cat => {
                const id = cat.toLowerCase().replace(/\s+/g, '-');
                const count = allModels.filter(m => m.category === cat).length;
                return count > 0 ? `<a href="#${id}">${cat} (${count})</a>` : '';
            }).join('');

            navContent.innerHTML = categories.map(cat => {
                const id = cat.toLowerCase().replace(/\s+/g, '-');
                return `<a href="#${id}">${cat}</a>`;
            }).join('');
        }

        // === ПРОВЕРКА АДМИНА ===
        const isAdmin = localStorage.getItem('adminLoggedIn') === 'true';
        const loginBtn = document.getElementById('loginBtn');
        const logoutBtn = document.getElementById('logoutBtn');

        if (isAdmin) {
            console.log("Режим администратора активирован:", localStorage.getItem('adminUser'));
            if (loginBtn) loginBtn.style.display = 'none';
            if (logoutBtn) logoutBtn.style.display = 'block';
            document.body.classList.add('admin-mode');
        }

        if (logoutBtn) {
            logoutBtn.addEventListener('click', () => {
                localStorage.removeItem('adminLoggedIn');
                localStorage.removeItem('adminUser');
                window.location.reload();
            });
        }

        // === МОДАЛЬНОЕ ОКНО ===
        let currentCategory = '';

        function openAddModal(category) {
            currentCategory = category;
            document.getElementById('modalCategoryTitle').textContent = category;
            document.getElementById('modalOverlay').classList.add('active');
            document.getElementById('formImage').value = '';
            document.getElementById('formName').value = '';
            document.getElementById('formItem').value = '';
            document.getElementById('formFeature').value = '';
            document.getElementById('resultBox').style.display = 'none';
            document.getElementById('btnCopy').style.display = 'none';
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
        }

        function generateCode() {
            const icon = document.getElementById('formImage').value || 'images/new.png';
            const name = document.getElementById('formName').value || 'Новый предмет';
            const item = document.getElementById('formItem').value || 'Предмет';
            const feature = document.getElementById('formFeature').value || '';

            const htmlCode = `{"category": "${currentCategory}", "icon": "${icon}", "name": "${name}", "item": "${item}", "feature": "${feature}"}`;
            
            const resultBox = document.getElementById('resultBox');
            resultBox.textContent = htmlCode;
            resultBox.style.display = 'block';
            document.getElementById('btnCopy').style.display = 'block';
        }

        function copyCode() {
            const code = document.getElementById('resultBox').textContent;
            navigator.clipboard.writeText(code).then(() => {
                const btn = document.getElementById('btnCopy');
                btn.textContent = '✅ Скопировано! Добавь в models.json';
                setTimeout(() => btn.textContent = '📋 Скопировать', 2000);
            });
        }

        // === ПЛЕЕР ===
        const playlist = [
            { name: "Lofi", src: "music/lofi.mp3" },
            { name: "LoFi c418 - Moog City", src: "music/LoFi c418 - Moog City.mp3" },
            { name: "LoFi c418 - Living Mice", src: "music/LoFi c418 - Living Mice.mp3" }
        ];

        let currentTrackIndex = 0;
        const mainAudio = document.getElementById('mainAudio');
        const playPauseBtn = document.getElementById('playPauseBtn');
        const trackNameDisplay = document.getElementById('trackName');
        const miniPlayer = document.getElementById('miniPlayer');
        const musicToggleBtn = document.getElementById('musicToggleBtn');
        const volumeSlider = document.getElementById('volumeSlider');
        const playlistToggleBtn = document.getElementById('playlistToggleBtn');
        const playlistContainer = document.getElementById('playlistContainer');

        function renderPlaylist() {
            playlistContainer.innerHTML = '';
            playlist.forEach((track, index) => {
                const li = document.createElement('li');
                li.className = 'playlist-item';
                li.textContent = track.name;
                li.onclick = () => {
                    currentTrackIndex = index;
                    loadTrack(currentTrackIndex);
                    mainAudio.play();
                    playPauseBtn.textContent = '⏸';
                };
                playlistContainer.appendChild(li);
            });
        }

        function updateActiveTrackInList() {
            const items = playlistContainer.querySelectorAll('.playlist-item');
            items.forEach((item, index) => {
                item.classList.toggle('active', index === currentTrackIndex);
            });
        }

        function loadTrack(index) {
            const track = playlist[index];
            mainAudio.src = track.src;
            trackNameDisplay.textContent = track.name;
            updateActiveTrackInList();
        }

        function togglePlay() {
            if (mainAudio.paused) {
                mainAudio.play();
                playPauseBtn.textContent = '⏸';
            } else {
                mainAudio.pause();
                playPauseBtn.textContent = '▶';
            }
        }

        playlistToggleBtn.addEventListener('click', () => {
            playlistContainer.classList.toggle('show');
        });

        renderPlaylist();
        loadTrack(currentTrackIndex);
        mainAudio.volume = volumeSlider.value;

        musicToggleBtn.addEventListener('click', () => miniPlayer.classList.toggle('active'));
        playPauseBtn.addEventListener('click', togglePlay);

        volumeSlider.addEventListener('input', (e) => {
            mainAudio.volume = e.target.value;
        });

        document.getElementById('nextBtn').addEventListener('click', () => {
            currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
            loadTrack(currentTrackIndex);
            mainAudio.play();
            playPauseBtn.textContent = '⏸';
        });

        document.getElementById('prevBtn').addEventListener('click', () => {
            currentTrackIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length;
            loadTrack(currentTrackIndex);
            mainAudio.play();
            playPauseBtn.textContent = '⏸';
        });

        // === СЕКРЕТКА ===
        const secretMusic = document.getElementById('secretMusic');
        let overscrollAttempts = 0;
        const requiredAttempts = 80;
        let isSecretActive = false;

        window.addEventListener('wheel', (e) => {
            if (isSecretActive) return;
            const isAtBottom = window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 10;
            if (isAtBottom && e.deltaY > 0) {
                overscrollAttempts++;
                if (overscrollAttempts >= requiredAttempts) activateSecret();
            } else if (!isAtBottom) {
                overscrollAttempts = 0;
            }
        });

        function activateSecret() {
            isSecretActive = true;
            const secretOverlay = document.getElementById('secretOverlay');
            const creepyText = document.getElementById('creepyText');
            secretOverlay.classList.remove('hidden');
            document.body.style.overflow = 'hidden';
            mainAudio.pause();
            musicToggleBtn.style.display = 'none';
            miniPlayer.classList.remove('active');
            secretMusic.play();
            creepyText.textContent = "Ты листал слишком долго";
            creepyText.className = "creepy-text fade-in";
            setTimeout(() => {
                creepyText.className = "creepy-text fade-out";
                setTimeout(() => {
                    creepyText.textContent = "С тобой все хорошо?";
                    creepyText.className = "creepy-text fade-in";
                    setTimeout(() => startMinecraftGlitch(creepyText), 3000);
                }, 1000);
            }, 3000);
        }

        function startMinecraftGlitch(element) {
            const alienChars = "ࢭࣨݺࣱࣚᶎᵓᵍᶊᶷḀϯ҉҈Ғ࣯ࣳᴇ࣬ࣔࢯ";
            element.className = "creepy-text glitch-active fade-in";
            setInterval(() => {
                let randomText = "";
                const length = Math.floor(Math.random() * 7) + 10;
                for (let i = 0; i < length; i++) {
                    randomText += alienChars.charAt(Math.floor(Math.random() * alienChars.length));
                }
                element.textContent = randomText;
            }, 70);
        }

        // === ФОН ===
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize);
        resize();

        // === САЙДБАРЫ ===
        document.querySelectorAll('.sidebar').forEach(sidebar => {
            const tab = sidebar.querySelector('.tab');
            let closeTimer;
            const open = () => { clearTimeout(closeTimer); sidebar.classList.add('open'); };
            const scheduleClose = () => { clearTimeout(closeTimer); closeTimer = setTimeout(() => sidebar.classList.remove('open'), 400); };
            sidebar.addEventListener('mouseenter', open);
            sidebar.addEventListener('mouseleave', scheduleClose);
            tab.addEventListener('mouseenter', open);
        });

        // === ЗАПУСК ===
        loadModels();
    </script>
</body>
</html>
