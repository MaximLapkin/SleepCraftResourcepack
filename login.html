<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в панель администратора</title>
    <!-- Подключаем твои основные стили -->
    <link rel="stylesheet" href="style.css"> 
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: var(--bg-color, #1a1a1a); }
        .login-box {
            background: var(--surface-color, #2a2a2a);
            border: 1px solid var(--border-color, #444);
            padding: 30px;
            border-radius: 12px;
            width: 300px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            text-align: center;
        }
        .login-box h2 { color: var(--accent, #58a6ff); margin-bottom: 20px; }
        .login-box input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            background: var(--bg-color, #1a1a1a);
            border: 1px solid var(--border-color, #444);
            color: var(--text-main, #e0e0e0);
            border-radius: 6px;
            box-sizing: border-box;
        }
        .login-box button {
            width: 100%;
            padding: 10px;
            background: var(--accent, #58a6ff);
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        .login-box button:hover { opacity: 0.8; }
        .error-msg { color: #ff4d4d; font-size: 0.85rem; margin-top: 10px; display: none; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>🔐 Вход в панель</h2>
        <form id="loginForm">
            <input type="text" id="username" placeholder="Логин" required autocomplete="off">
            <input type="password" id="password" placeholder="Пароль" required>
            <button type="submit">Войти</button>
        </form>
        <div class="error-msg" id="errorMsg">Неверный логин или пароль!</div>
        <br>
        <a href="index.html" style="color: var(--text-main, #e0e0e0); font-size: 0.8rem;">← Вернуться на сайт</a>
    </div>

    <script src="users.js"></script>
    <script>
        // СЕКРЕТНАЯ СОЛЬ (можешь изменить эту строку на любую свою абракадабру)
        // Она добавляется к паролю перед хешированием, делая онлайн-подбор бесполезным
        const SECRET_SALT = "SCRP_Salt_2024_Secret_Key_!@#";

        async function hashPassword(password) {
            // Добавляем соль к паролю перед хешированием
            const combined = password + SECRET_SALT;
            const msgUint8 = new TextEncoder().encode(combined);
            const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const login = document.getElementById('username').value.trim();
            const pass = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');

            const hashedPass = await hashPassword(pass);

            if (ADMIN_USERS[login] && ADMIN_USERS[login] === hashedPass) {
                localStorage.setItem('adminLoggedIn', 'true');
                localStorage.setItem('adminUser', login);
                window.location.href = 'index.html';
            } else {
                errorMsg.style.display = 'block';
                setTimeout(() => errorMsg.style.display = 'none', 3000);
            }
        });
    </script>

</body>
</html>
